[package]
name = "pulsar"
version = "0.1.0"
edition = "2024"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[dependencies]
llrt_core = { path = "llrt/llrt_core", default-features = true }
rquickjs = { version = "0.14", features = ["full-async"] }
clap = { version = "4.0.4", features = ["derive", "cargo"]}
thiserror = "2.0.12"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.141"
num_cpus = "1.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3.31"
tokio-stream = { version = "0.1.17", features = ["io-util"] }
bincode = "1"
flume = "0.12"
pprof2 = { version = "0.13.1", features = ["prost-codec"] }
v8 = { version = "152.2.0", optional = true }

[features]
v8 = ["dep:v8"]

